# ---------------------------------------------------------------------------
# system: ModelArchivist
# file: .github/workflows/publish.yaml
# purpose: Manually publish a validated release tag with a freshly built frontend
# ---------------------------------------------------------------------------

name: Publish to Comfy Registry
run-name: Publish ${{ inputs.tag }} to Comfy Registry

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching pyproject.toml (for example v0.8.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: comfy-registry-publication
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate release metadata and master-branch ancestry
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/check-release.py --tag "$RELEASE_TAG"
      - name: Record immutable release revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  checks:
    name: Release checks
    needs: validate
    uses: ./.github/workflows/ci.yaml
    with:
      ref: ${{ needs.validate.outputs.revision }}

  publish:
    name: Build and publish
    needs: [validate, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check committed build before rebuilding
        working-directory: frontend
        run: npm run check:build -- --committed
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend for publication
        working-directory: frontend
        run: npm run build
      - name: Verify fresh output
        working-directory: frontend
        run: npm run check:build
      - name: Install publishing tool
        run: python -m pip install comfy-cli==1.22.0
      - name: Publish to Comfy Registry
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          if [ -z "$REGISTRY_ACCESS_TOKEN" ]; then
            echo "::error::Set the REGISTRY_ACCESS_TOKEN Actions secret before publishing."
            exit 1
          fi
          comfy --skip-prompt --no-enable-telemetry node publish --token "$REGISTRY_ACCESS_TOKEN"
