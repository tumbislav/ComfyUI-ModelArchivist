# ---------------------------------------------------------------------------
# system: ModelArchivist
# file: .github/workflows/publish.yaml
# purpose: Manually publish a validated release tag with a freshly built frontend
# ---------------------------------------------------------------------------

name: Publish to Comfy Registry
run-name: Publish ${{ inputs.tag }} to Comfy Registry

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching pyproject.toml (for example v0.8.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: comfy-registry-publication
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Check release tag input
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Enter a Git tag in vX.Y.Z form, for example v0.8.0 (not 0.8.0)."
            exit 1
          fi
          if ! git ls-remote --exit-code --tags "https://github.com/${REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "::error::Tag ${RELEASE_TAG} does not exist. Create it on the release commit and push it before publishing."
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate release metadata and master-branch ancestry
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/check-release.py --tag "$RELEASE_TAG"
      - name: Record immutable release revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  checks:
    name: Release checks
    needs: validate
    uses: ./.github/workflows/ci.yaml
    with:
      ref: ${{ needs.validate.outputs.revision }}

  publish:
    name: Build and publish
    needs: [validate, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check committed build before rebuilding
        working-directory: frontend
        run: npm run check:build -- --committed
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend for publication
        working-directory: frontend
        run: npm run build
      - name: Verify fresh output
        working-directory: frontend
        run: npm run check:build
      - name: Install publishing tool
        run: python -m pip install comfy-cli==1.22.0
      - name: Publish to Comfy Registry
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          if [ -z "$REGISTRY_ACCESS_TOKEN" ]; then
            echo "::error::Set the REGISTRY_ACCESS_TOKEN Actions secret before publishing."
            exit 1
          fi
          comfy --skip-prompt --no-enable-telemetry node publish --token "$REGISTRY_ACCESS_TOKEN"
