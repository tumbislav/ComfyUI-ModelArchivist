# ---------------------------------------------------------------------------
# system: ModelArchivist
# file: config.toml
# purpose: Bootstrap configuration
# ---------------------------------------------------------------------------

[database]
database_file = "{$app}/model-archivist.db"

[web]
host = "127.0.0.1"
port = 5173
static_html = "{$app}/frontend/build"

[logging]
level = "DEBUG"
sql_level = "WARNING"
file = "{$app}/model-archivist.log"

# On first startup, Archivist appends [filesystem] permissions for this machine.
# Edit those absolute working/archive roots and exclusions on disk, then restart.
# See docs/INSTALLATION.md#filesystem-permissions.

