[build-system]
requires = ["setuptools >= 80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-model-archivist"
version = "0.1"
requires-python = ">= 3.12"
description = "Manage an overabundance of models in a ComfyUI environment"
authors = [{name="Marko Čibej"}]
license = "GPL-3.0-or-later"
dependencies = [
    "aiohttp >= 3.11.0",
    "alembic >= 1.17.2",
    "fastapi >= 0.124.4",
    "pydantic >= 2.10.0",
    "sqlalchemy >= 2.0.0",
    "sqlmodel >= 0.0.27",
    "uvicorn >= 0.40.0"
]

[project.optional-dependencies]
dev = [
    "pytest >= 9.0.2"
]
